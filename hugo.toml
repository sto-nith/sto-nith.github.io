baseURL = "https://saurabh-pant.com/"
locale = "en-us"
title = "Saurabh Pant"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

pagination.pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  description = "Notes on data engineering, Flink, and AI."
  author = "Saurabh Pant"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true

  # Modern editorial: cover images on post list
  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false
    responsiveImages = false

  # ProfileMode home — avatar + tagline + links
  [params.profileMode]
    enabled = true
    title = "Saurabh Pant"
    subtitle = "Engineer. Notes on Flink, real-time data, and AI experiments."
    imageUrl = "/avatar.svg"
    imageWidth = 140
    imageHeight = 140
    imageTitle = "Saurabh Pant"

    [[params.profileMode.buttons]]
      name = "Read Posts"
      url = "posts"
    [[params.profileMode.buttons]]
      name = "Archive"
      url = "archives"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/sto-nith"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.assets]
    disableHLJS = false

[markup]
  [markup.highlight]
    style = "catppuccin-mocha"
    lineNos = false
    codeFences = true
    guessSyntax = true
    noClasses = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archives/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]
